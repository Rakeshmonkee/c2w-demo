<html>
  <head>
    <title>container + WASI on browser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.17.0/css/xterm.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #12151a;
        --panel: #1a1e26;
        --bezel: #22262f;
        --hairline: #2e333d;
        --text: #d8dee4;
        --text-dim: #7d8590;
        --amber: #e8a33d;
        --teal: #4fa6a6;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        background-image:
          radial-gradient(ellipse at top, rgba(232, 163, 61, 0.05), transparent 55%);
        color: var(--text);
        font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .console {
        width: 100%;
        max-width: 980px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 6px;
        overflow: hidden;
        box-shadow:
          0 40px 80px -32px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      }

      .console__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--bezel);
        border-bottom: 1px solid var(--hairline);
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .console__status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
      }

      .console__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .console__meta {
        color: var(--text-dim);
      }

      .console__screen {
        position: relative;
        padding: 20px;
        background: #0d0f13;
      }

      .console__screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 3px
        );
      }

      #terminal {
        position: relative;
      }

      #terminal .xterm {
        padding: 4px;
      }

      .console__footer {
        padding: 8px 16px;
        border-top: 1px solid var(--hairline);
        background: var(--bezel);
        font-size: 11px;
        color: var(--text-dim);
        text-align: right;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        .console__dot { animation: none; }
      }

      @media (max-width: 640px) {
        body { padding: 8px; }
        .console__bar, .console__footer { padding: 8px 12px; font-size: 11px; }
        .console__screen { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="console">
      <div class="console__bar">
        <div class="console__status">
          <span class="console__dot"></span>
          container2wasm
        </div>
        <span class="console__meta">x86_64 · bochs</span>
      </div>
      <div class="console__screen">
        <div id="terminal"></div>
      </div>
      <div class="console__footer">wasi runtime, running in-browser</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@4.17.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-pty@0.9.4/index.js"></script>
    <script src="./stack.js"></script>
    <script src="./ws-delegate.js"></script>
    <script>
      const xterm = new Terminal();
      xterm.open(document.getElementById("terminal"));

      const { master, slave } = openpty();

      termios = slave.ioctl("TCGETS");
      termios.iflag &= ~(/*IGNBRK | BRKINT | PARMRK |*/ ISTRIP | INLCR | IGNCR | ICRNL | IXON);
      termios.oflag &= ~(OPOST);
      termios.lflag &= ~(ECHO | ECHONL | ICANON | ISIG | IEXTEN);
      //termios.cflag &= ~(CSIZE | PARENB);
      //termios.cflag |= CS8;
      slave.ioctl("TCSETS", new Termios(termios.iflag, termios.oflag, termios.cflag, termios.lflag, termios.cc));
      xterm.loadAddon(master);
      const worker = new Worker("./worker.js"+location.search);

      var nwStack;
      var netParam = getNetParam();
      var workerImage = location.origin + "/out.wasm";
      if (netParam) {
          if (netParam.mode == 'delegate') {
              nwStack = delegate(worker, workerImage, netParam.param);
          } else if (netParam.mode == 'browser') {
              nwStack = newStack(worker, workerImage, new Worker("./stack-worker.js"+location.search), location.origin + "/c2w-net-proxy.wasm");
          }
      }
      if (!nwStack) {
          worker.postMessage({type: "init", imagename: workerImage});
      }
      new TtyServer(slave).start(worker, nwStack);

      function getNetParam() {
          var vars = location.search.substring(1).split('&');
          for (var i = 0; i < vars.length; i++) {
              var kv = vars[i].split('=');
              if (decodeURIComponent(kv[0]) == 'net') {
                  return {
                      mode: kv[1],
                      param: kv[2],
                  };
              }
          }
          return null;
      }
    </script>
  </body>
</html>
